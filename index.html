<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mario Makdis | Data Engineer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <canvas id="particle-canvas"></canvas>

    <header class="fullscreen-section">
        <div class="container">
            <h1 class="animated-text">MARIO MAKDIS</h1>
            <p class="animated-subtext"></p>
        </div>
        <a href="#about" class="scroll-down-link" aria-label="Scroll down">
            <div class="scroll-down"></div>
        </a>
    </header>

    <nav class="main-nav">
        <ul>
            <li><a href="#about">01.ABOUT</a></li>
            <li><a href="#experience">02.EXPERIENCE</a></li>
            <li><a href="#projects">03.PROJECTS</a></li>
            <li><a href="#skills">04.SKILLS</a></li>
        </ul>
    </nav>

    <main>
        <section id="about" class="content-section">
            <div class="container">
                <h2 class="section-title"><span>01.</span> About Me</h2>
                <div class="about-content">
                    <div class="about-text">
                        <p id="about-description"></p>
                    </div>
                    <div class="about-image">
                        <img id="profile-pic" src="" alt="Mario Makdis">
                    </div>
                </div>
            </div>
        </section>

        <section id="experience" class="content-section">
            <div class="container">
                <h2 class="section-title"><span>02.</span> Experience</h2>
                <div class="timeline" id="experience-timeline">
                </div>
            </div>
        </section>

        <section id="projects" class="content-section">
            <div class="container">
                <h2 class="section-title"><span>03.</span> Projects</h2>
                <div class="projects-grid" id="projects-grid">
                </div>
            </div>
        </section>

        <section id="skills" class="content-section">
            <div class="container">
                <h2 class="section-title"><span>04.</span> Skills</h2>
                <div class="skills-grid" id="skills-grid">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container" id="footer-container">
            <div class="social-links" id="social-links">
            </div>
            <p>&copy; 2025 Mario Makdis</p>
    </footer>

    <div id="project-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close-btn">&times;</button>
            <div class="modal-body">
                <div class="modal-images">
                </div>
                <div class="modal-details">
                    <h3 id="modal-title"></h3>
                    <p id="modal-description"></p>
                    <div id="modal-tech-list"></div>
                    <a id="modal-url" href="#" target="_blank" rel="noopener noreferrer">View Project <i
                            class="fa-solid fa-arrow-up-right-from-square"></i></a>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
